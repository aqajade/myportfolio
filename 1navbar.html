<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Fundamentals</title>
    <!-- normalize.css u/ konsisten di tiap browser, font awesome u/ icons, css external, & js external -->
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <!-- <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/main.js"></script>
    <style>
        /* Istok Web font */
@import url('https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap');
/* Poppins font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

:root{
    --primary-color:#4B4C4E;
    --accent-color:#74C0FC;
}

.header{
    display: flex;
    justify-content:space-between;
    padding-top: 70px;
    max-width: 1024px; 
    font-family: 'Istok Web',sans-serif;
    margin: 0 auto;
}

.header_title{
    align-items: center;
    display: flex;
    margin: 0;
    margin-left: 40px;
}

.header span{
    font-weight: 700;
    font-size: 40px;
    color: var(--primary-color);
    margin-right: 10px;
}

.header .fa-paper-plane{
    color: var(--accent-color);
}

.header .fa-circle-xmark,
.header .fa-bars{
    display: none;
}

.header_navigation{
    display: flex;
    align-items: center;
    gap: 100px;
}

.header_navigation a{
    text-decoration: none;
    font-size: 18px;
    color: var(--primary-color);
}
    </style>
</head>
<body>
    <!-- header -->
    <header class="header">
        <h2 class="header_title">
            <span>Reza</span>
            <i class="fa-solid fa-paper-plane" ></i>
        </h2>
        <nav class="header_navigation">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Works</a>
            <a href="">Contact</a>
        </nav>
        <i class="fa-solid fa-bars" style="color: #74C0FC;"></i>
        <i class="fa-solid fa-circle-xmark" style="color: #ff2954;"></i>
    </header>
</body>
</html>
